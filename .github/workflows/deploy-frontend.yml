name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build Project
        working-directory: ./Frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://gauravchavdavhits.github.io/personal-portfolio-
          VITE_API_URL: https://personal-portfolio-backend.onrender.com/api/v1
        run: |
          npm run build
          # Create 404.html to handle client-side routing on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
